<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Bicing Availability</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root {
    --bg: #0c0e12;
    --panel: #14171d;
    --panel-2: #1b1f27;
    --line: #272c36;
    --line-2: #333a47;
    --ink: #f4f6fa;
    --ink-2: #aab2c0;
    --ink-3: #6c7585;
    --accent: #5b9dff;
    --r: 12px;
    --font: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overscroll-behavior: none; }
  #root { height: 100%; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { position: relative; height: 100%; width: 100%; display: flex; }
  #map { position: absolute; inset: 0; background: #0c0e12; z-index: 0; }

  /* Leaflet dark tweaks */
  .leaflet-container { background: #0c0e12; font-family: var(--font); }
  .leaflet-bar a, .leaflet-bar a:hover { background: var(--panel-2); color: var(--ink-2); border-color: var(--line); }
  .leaflet-control-attribution { background: rgba(12,14,18,.7) !important; color: var(--ink-3) !important; font-size: 10px; }
  .leaflet-control-attribution a { color: var(--ink-2) !important; }
  .leaflet-control-zoom { box-shadow: none !important; border: 1px solid var(--line) !important; border-radius: 9px !important; overflow: hidden; }

  /* ---------- mode toggle (floating top center) ---------- */
  .mode-toggle {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 1200; display: flex; gap: 3px; padding: 4px;
    background: rgba(20,23,29,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line-2); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .mode-toggle button {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 14px;
    color: var(--ink-2); background: transparent; padding: 9px 20px; border-radius: 999px;
    display: flex; align-items: center; gap: 8px; transition: color .15s, background .15s;
  }
  .mode-toggle button .dotmark { width: 9px; height: 9px; border-radius: 50%; }
  .mode-toggle button.on { color: #fff; }
  .mode-toggle button.on.pickup { background: linear-gradient(120deg, #d63a46, #28b463); }
  .mode-toggle button.on.dropoff { background: linear-gradient(120deg, #d63a46, #3482dc); }

  /* ---------- panel (sidebar / bottom sheet) ---------- */
  .panel {
    position: relative; z-index: 1100; width: 33%; min-width: 340px; max-width: 420px; height: 100%;
    background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; box-shadow: 8px 0 40px rgba(0,0,0,.35);
  }
  .panel-head { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
  .panel-head h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; font-weight: 700; }
  .panel-head p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-3); letter-spacing: .01em; }
  .panel-body { flex: 1; overflow-y: auto; padding: 18px 22px 26px; }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }

  .field { margin-bottom: 22px; }
  .field > label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); margin-bottom: 9px; font-weight: 600; }

  /* day pills */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .days button {
    appearance: none; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2);
    border-radius: 9px; padding: 9px 0; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: all .13s;
  }
  .days button:hover { border-color: var(--line-2); color: var(--ink); }
  .days button.on { background: var(--ink); color: #11141a; border-color: var(--ink); }

  /* time slider */
  .time-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .time-val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .time-cap { font-size: 12px; color: var(--ink-3); }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px;
    background: var(--line-2); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.5); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: pointer; }
  .ticks { display: flex; justify-content: space-between; margin-top: 7px; font-size: 10.5px; color: var(--ink-3); }

  /* bike filter segmented */
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 4px; min-height: 44px; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13px; font-weight: 600; padding: 9px 0; border-radius: 8px; cursor: pointer; transition: all .13s; }
  .seg button.on { background: var(--line-2); color: #fff; }
  /* drop-off replacement: same box + min-height as .seg so the panel never jumps */
  .seg-note { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 44px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 4px 12px; }
  .seg-note span { font-size: 12.5px; color: var(--ink-3); line-height: 1.3; }

  /* legend */
  .legend {
    position: absolute; z-index: 1100; right: 14px; bottom: 14px; width: 214px;
    background: rgba(20,23,29,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .legend .lt { font-size: 11.5px; color: var(--ink-2); font-weight: 600; margin-bottom: 9px; line-height: 1.3; }
  .legend .lt b { color: var(--ink); }
  .legend .bar { height: 9px; border-radius: 999px; }
  .legend .lr { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10.5px; color: var(--ink-3); }
  .legend .lnote { margin-top: 7px; font-size: 10.5px; color: var(--ink-3); line-height: 1.3; }

  /* station detail */
  .detail { margin-top: 4px; border-top: 1px solid var(--line); padding-top: 18px; }
  .detail.empty { color: var(--ink-3); font-size: 13px; line-height: 1.55; }
  .detail .dkicker { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 600; }
  .detail .dname { font-size: 16.5px; font-weight: 700; margin: 5px 0 2px; letter-spacing: -.01em; line-height: 1.25; }
  .detail .dmeta { font-size: 12px; color: var(--ink-3); margin-bottom: 14px; }
  .detail .big { display: flex; align-items: baseline; gap: 10px; }
  .detail .bignum { font-size: 54px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .detail .biglbl { font-size: 12.5px; color: var(--ink-2); max-width: 130px; line-height: 1.35; }
  .detail .dsample { margin-top: 10px; font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
  .detail .dsample.low { color: #e2aa2d; }
  .chart-wrap { margin-top: 16px; }
  .chart-cap { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-bottom: 7px; }
  .dclose { float: right; appearance: none; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink-2); width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 14px; line-height: 1; }

  /* mobile sheet handle (hidden on desktop) */
  .sheet-handle { display: none; }
  .sheet-grip { display: none; }

  /* ---------- responsive: mobile bottom sheet ---------- */
  @media (max-width: 859px) {
    .app { display: block; }
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: 100%; max-width: none; min-width: 0; height: auto;
      max-height: 76vh; border-right: 0; border-top: 1px solid var(--line-2);
      border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.5);
      transform: translateY(calc(100% - var(--peek, 76px))); transition: transform .32s cubic-bezier(.4,0,.2,1);
    }
    .panel.open { transform: translateY(0); }
    .panel-head { padding-top: 8px; }
    .sheet-grip { display: block; width: 40px; height: 4px; border-radius: 999px; background: var(--line-2); margin: 9px auto 2px; }
    .sheet-handle {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0;
    }
    .sheet-handle .sh-sub { font-size: 12px; color: var(--ink-3); font-weight: 600; }
    .panel-body { padding-top: 14px; }
    .legend {
      bottom: calc(var(--peek, 76px) + 12px); right: 12px; width: 188px;
      transition: opacity .2s ease, transform .32s cubic-bezier(.4,0,.2,1), visibility 0s linear 0s;
    }
    /* The open sheet covers most of the map, so the legend would only sit on
       top of the controls: fade it out until the sheet closes again. */
    .panel.open ~ .legend {
      opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(12px);
      transition: opacity .2s ease, transform .32s cubic-bezier(.4,0,.2,1), visibility 0s linear .2s;
    }
    .mode-toggle { top: 14px; }
  }
  @media (max-width: 420px) {
    .legend { width: 160px; }
    .mode-toggle button { padding: 9px 16px; font-size: 13px; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="bicing.js"></script>
  <!-- app.js is compiled from app.jsx: run `npm run build` after editing app.jsx -->
  <script src="app.js"></script>
</body>
</html>
