# Safety net for the data update that runs on your Mac
# (scripts/macos/weekly_update.sh). Once a week this checks Barcelona Open
# Data's catalogue (reachable from GitHub; only downloads are blocked) and, if
# the newest published month has been out for a week but isn't in
# data/monthly/index.json yet, opens an issue as a reminder. It never opens a
# second issue while one is still open.
name: Data update reminder

on:
  schedule:
    - cron: "17 9 * * 3"   # Wednesdays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compare the portal's newest month with ours
        id: cmp
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re, sys, urllib.request, datetime as dt
          url = "https://opendata-ajuntament.barcelona.cat/data/api/3/action/package_show?id=estat-estacions-bicing"
          req = urllib.request.Request(url, headers={"User-Agent": "bicing-dashboard reminder (+https://github.com/${{ github.repository }})"})
          res = json.load(urllib.request.urlopen(req, timeout=60))["result"]["resources"]
          months = {}
          for r in res:
              m = re.match(r"(\d{4})_(\d{2})_.*\.7z$", r.get("name") or "")
              if m:
                  months[f"{m[1]}_{m[2]}"] = r
          newest = max(months)
          try:
              have = json.load(open("data/monthly/index.json"))
          except FileNotFoundError:
              have = {}
          published = (months[newest].get("created") or "")[:10]
          age = (dt.date.today() - dt.date.fromisoformat(published)).days if published else 99
          due = newest not in have and age >= 7
          print(f"newest={newest}")
          print(f"name={months[newest]['name']}")
          print(f"published={published}")
          print(f"due={'true' if due else 'false'}")
          print(f"Portal newest: {newest} (published {published}, {age} days ago); in repo: {newest in have}", file=sys.stderr)
          EOF

      - name: Open a reminder issue
        if: steps.cmp.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.cmp.outputs.newest }}
          NAME: ${{ steps.cmp.outputs.name }}
          PUBLISHED: ${{ steps.cmp.outputs.published }}
        run: |
          TITLE="Bicing data update needed: ${NEWEST/_/-}"
          if gh issue list --state open --search "in:title \"Bicing data update needed\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "A reminder issue is already open."; exit 0
          fi
          gh issue create --title "$TITLE" --body "Barcelona Open Data published **$NAME** on $PUBLISHED, but it isn't in the dashboard data yet.

          The weekly update on the Mac should pick it up automatically. If it hasn't, run it by hand:

          \`\`\`bash
          scripts/macos/weekly_update.sh
          \`\`\`

          and check \`~/Library/Logs/bicing-dashboard-update.log\` for errors. (The portal blocks downloads from cloud servers such as GitHub, so this can't be done here.)

          Close this issue once the data pull request is merged."
